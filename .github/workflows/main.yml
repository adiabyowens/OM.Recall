name: Build, Scan and Email Report

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t recallapp:latest .

      - name: Run Docker Scout and output SARIF   
        run: |
          docker scout cves recall:latest --output ./scout-report.sarif
  
        # uses: docker/scout-action@v1
        # with:
        #   command: cves
        #   image: recallapp:latest
        #   format: sarif
        #   output: scout-report.sarif
      - name: Verify file exists
        run: |
            ls -al
            cat scout-report.sarif
      - name: Check for vulnerabilities
        run: |
          if grep -q '"level": "error"' scout-report.sarif; then
            echo "Vulnerabilities found in the Docker image."
            exit 1
          else
            echo "No vulnerabilities found."
          fi


      - name: Upload SARIF report to GitHub
        uses: github/codeql-action/upload-sarif@v2
        with:
              sarif_file: scout-report.sarif
      - name: Send vulnerability report via email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Docker Scout CVE Report for recallapp
          to: ${{ secrets.REPORT_RECIPIENT }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            Hello,

            Please find attached the latest Docker Scout CVE scan report for the image `recallapp:latest`.

            Regards,
            GitHub Actions
          attachments: scout-report.sarif
