name: Build and Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t recallapp:latest .
          docker scout cves recallapp:latest --output json > svest.json  

      - name: Tag and push Docker image
        run: |
          docker tag recallapp:latest ${{ secrets.DOCKER_USERNAME }}/recallapp:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/recallapp:latest
